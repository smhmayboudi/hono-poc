  redis:
    command:
      - /usr/local/etc/redis/redis.conf
    container_name: hono-redis
    expose:
      - 6379 # Default Protocol
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        - CMD-SHELL
        - redis-cli --raw incr ping
      timeout: 5s
    image: redis:7.4.2-bookworm
    labels:
      namespace: redis
    logging: *logging
    ports:
      - "6379:6379"
    restart: "no"
    volumes:
      - ./.docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis:/data

