# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

x-default-logging: &logging
  driver: json-file
  options:
    max-file: 2
    max-size: 5m

services:
  devcontainer:
    command:
      - /bin/sh
      - -c
      - -Eefuvx
      - >-
        export DEBIAN_FRONTEND=noninteractive
        && apt update
        && apt --yes upgrade &&
        && apt --yes install --no-install-recommends git
        && apt clean &&
        && rm -rf /var/lib/apt/lists/*
        && sleep infinity
    container_name: hono-devcontainer
    depends_on:
      mysql:
        condition: service_healthy
    image: node:22.14.0-bookworm
    labels:
      namespace: devcontainer
    logging: *logging
    restart: "no"

  elasticsearch:
    container_name: hono-elasticsearch
    environment:
      - discovery.type=single-node
      # - logger.discovery.name = org.elasticsearch.discovery
      # - logger.discovery.level = trace
    expose:
      - 9200 # API Call
      - 9300 # Custom Binary Protocol
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        - CMD-SHELL
        - curl --fail http://elasticsearch:9200/_cluster/health || exit 1
      timeout: 5s
    image: elasticsearch:7.17.27
    labels:
      namespace: elasticsearch
    logging: *logging
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: "no"

  hono-poc:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: hono-hono-poc
    depends_on:
      hono-poc-migration:
        condition: service_completed_successfully
    environment:
      - CLIENT_DATABASE_URI=mysql://mysql_user:mysql_password@mysql:3306/hono-poc?charset=utf8mb4&connectionLimit=1
      - CLIENT_ELASTICSEARCH_NODE=http://elasticsearch:9200
      - CLIENT_REDIS_URL=redis://redis:6379
      - SERVER_PORT=80
    expose:
      - 8081
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        - CMD-SHELL
        - wget --no-verbose --spider --tries=1 http://hono-poc:80/api/v1/healthy
      timeout: 5s
    labels:
      namespace: hono-poc
    logging: *logging
    ports:
      - "8081:80"
    restart: "no"

  hono-poc-migration:
    build:
      context: .
      dockerfile: ./Dockerfile
    command:
      - /bin/sh
      - -c
      - -Eefuvx
      - >-
        pnpm run db
    container_name: hono-hono-poc-migration
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - CLIENT_DATABASE_URI=mysql://mysql_user:mysql_password@mysql:3306/hono-poc?charset=utf8mb4&connectionLimit=1
      - CLIENT_ELASTICSEARCH_NODE=http://elasticsearch:9200
      - CLIENT_REDIS_URL=redis://redis:6379
      - SERVER_PORT=80
    expose:
      - 8081
    labels:
      namespace: hono-poc-migration
    logging: *logging
    restart: "no"

  k6:
    command:
      - run
      - /home/k6/workspace/test/e2e/build/server.js
      - --compatibility-mode=base
      - --config=/home/k6/workspace/test/e2e/config.json
    container_name: hono-k6
    environment:
      - BASE_URL=http://hono-poc:8081/api/v1
      - SLEEP_DURATION=0.1
    depends_on:
      hono-poc:
        condition: service_healthy
    image: grafana/k6:0.56.0
    labels:
      namespace: k6
    logging: *logging
    restart: "no"
    volumes:
      - .:/home/k6/workspace

