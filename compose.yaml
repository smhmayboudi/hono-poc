  mysql:
    command:
      - --mysql-native-password=ON
    container_name: hono-mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=hono-poc
      - MYSQL_PASSWORD=mysql_password
      - MYSQL_ROOT_PASSWORD=mysql_root_password
      - MYSQL_USER=mysql_user
    expose:
      - 3306 # Default Protocol
      - 33060 # X Protocol
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --password=$$MYSQL_PASSWORD --user=$$MYSQL_USER
      timeout: 5s
    image: mysql:8.4.3-oraclelinux9
    labels:
      namespace: mysql
    logging: *logging
    ports:
      - "3306:3306"
      - "33060:33060"
    restart: "no"
    volumes:
      - ./.docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql:/var/lib/mysql

