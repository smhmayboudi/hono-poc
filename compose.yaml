  phpmyadmin:
    container_name: hono-phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PMA_HOST=mysql
      - PMA_PASSWORD=mysql_root_password
      - PMA_USER=root
      - UPLOAD_LIMIT=128M
    expose:
      - 80 # Panel
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        - CMD-SHELL
        - curl --fail http://phpmyadmin:80 || exit 1
      timeout: 5s
    image: phpmyadmin:5.2.1-apache
    ports:
      - "8082:80"
    labels:
      namespace: phpmyadmin
    logging: *logging
    restart: "no"

